      site-config/crunchy-replicas-transformer.yaml: |
        # Replace all instances of the variable {{ REPLICAS-COUNT }}, including the braces,
        # with the number of PostgreSQL replicas you would like to have.
        #
        # Note: this is the total count of PostgreSQL nodes you will have, not just the nodes
        # acting as "replicas" in a high-availability configuration. For example, using the
        # value 3 will result in 3 total PostgreSQL nodes.

        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: crunchy-replicas-transformer
        patch: |-
          - op: replace
            path: /spec/instances/0/replicas
            value: 1
        target:
          group: postgres-operator.crunchydata.com
          kind: PostgresCluster
          name: .*
          version: v1beta1
      site-config/rabbitmq-node-count.yaml: |-
        # This block of code is for specifying the number of nodes in the RabbitMQ
        # cluster. The default value is 3. SAS recommends an odd number such as 1,3, or 5.
        ---
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: rabbitmq-node-count
        patch: |-
            - op: replace
              path: /spec/replicas
              value: 1
        target:
          group: apps
          kind: StatefulSet
          name: sas-rabbitmq-server
          version: v1
      site-config/sas-compute-server/configure/compute-server-add-nfs-mount.yaml: |-
        # This block of code is for mounting NFS persistentVolumeClaims
        # to a compute session
        ---
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: compute-server-add-nfs-mount
        patch: |-
          - op: add
            path: /template/spec/volumes/-
            value:
              name: sasviya-data
              nfs:
                path: /export
                server: 10.0.4.4
          - op: add
            path: /template/spec/containers/0/volumeMounts/-
            value:
              name: sasviya-data
              mountPath: /export
        target:
          kind: PodTemplate
          version: v1
          labelSelector: sas.com/template-intent=sas-launcher
      site-config/sas-launcher/configure/launcher-nfs-mount.yaml: |-
        ###################################################################################
        # Kustomize patch configuration to change the add the launcher.sas.com/nfs-server
        # PodTemplate annotation. This allows you to configure Viya with the location of
        # the NFS server hosting a user's home directories at deployment time. The path
        # is determined by the identities service.
        # See README.md for more information.
        ###############################################################################
        ---
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: sas-launcher-nfs-mount
        patch: |-
          - op: add
            path: /metadata/annotations/launcher.sas.com~1nfs-server
            value: 10.0.4.4
        target:
          kind: PodTemplate
          labelSelector: sas.com/template-intent=sas-launcher
      site-config/sas-singlestore/kustomization.yaml: |-
        apiVersion: kustomize.config.k8s.io/v1alpha1
        kind: Component

        generators:
          - sas-singlestore-secret.yaml
      site-config/sas-singlestore/sas-singlestore-cluster-config.yaml: |-
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: ss
        patch: |-
          - op: replace
            path: /spec/redundancyLevel
            value: 1
          - op: replace
            path: /spec/serviceSpec/type
            value: LoadBalancer
          - op: replace:
            path: /spec/serviceSpec/loadBalancerSourceRanges
            value: []
          - op: replace
            path: /spec/aggregatorSpec/count
            value: 1
          - op: replace
            path: /spec/aggregatorSpec/height
            value: 1
          - op: replace
            path: /spec/aggregatorSpec/storageGB
            value: 128
          - op: replace
            path: /spec/leafSpec/count
            value: 1
          - op: replace
            path: /spec/leafSpec/height
            value: 1
          - op: replace
            path: /spec/leafSpec/storageGB
            value: 128
          - op: replace
            path: /spec/leafSpec/storageClass
            value: managed-csi
          - op: replace
            path: /spec/aggregatorSpec/storageClass
            value: managed-csi
        target:
          kind: MemsqlCluster
        ---
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: modify-singlestore-operator-args
        patch: |-
          - op: replace
            path: /spec/template/spec/containers/0/args
            value:
                - --merge-service-annotations
                - --fs-group-id
                - "5555"
                - --overpack-factor
                - ".15"
                - --cluster-id
                - sas-singlestore-cluster
                - --memory-per-unit
                - "64"
        target:
          kind: Deployment
          name: sas-singlestore-operator
      site-config/sas-singlestore/sas-singlestore-secret.yaml: |-
        ---
        apiVersion: builtin
        kind: SecretGenerator
        metadata:
          name: sas-singlestore-secret
        behavior: merge
        literals:
        - license={{ LICENSE-CODE }}
        - adminHashedPassword={{ HASHED-ADMIN-PASSWORD }}
      site-config/security/container-security/configmap-inputs.yaml: |-
        ## Example ConfigMap that defines the fsGroup value.
        ##
        ## The location that requires a user specified value is indicated by a capitalized and
        ## name set off by curly braces and a space at each end. Replace this token with the
        ## actual value. Replace the curly braces, interior spaces, and the variable name.
        ## For instance, 1000760000 should be replaced by the desired fsgroup value.
        ## Example:
        ##   fsGroup: "1000700000"

        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: security-container-security-inputs
          labels:
            sas.com/admin: none
        data:
          fsGroup: "1000760000"
      site-config/sitedefault.yaml: "## This is a sitedefault.yaml file, matching the OpenLDAP deployed by the manifest.\n## You do not apply this file. Instead you will reference it in your manifest\n---\nconfig:\n  application:\n    sas.identities.providers.ldap.connection:\n      host: '172.30.222.182'\n      port: '389'\n      url: 'ldap://${sas.identities.providers.ldap.connection.host}:${sas.identities.providers.ldap.connection.port}'\n      userDN: 'cn=admin,dc=openldap,dc=com'\n      password: 'Password123'\n      anonymousBind: 'false'\n    sas.identities.providers.ldap.group:\n      accountId: 'cn'\n      baseDN: 'dc=openldap,dc=com'\n      createdDate: 'createTimestamp'\n      distinguishedName: 'none'\n      member: 'memberUid'\n      memberOf: 'none'\n      modifiedDate: 'modifyTimestamp'\n      objectClass: 'posixGroup'\n      objectFilter: '(objectClass=posixGroup)'\n      searchFilter: '${sas.identities.providers.ldap.group.accountId}={0}'\n    sas.identities.providers.ldap.user:\n      accountId: 'uid'\n      baseDN: 'dc=openldap,dc=com'\n      createdDate: 'createTimestamp'\n      distinguishedName: 'none'\n      memberOf: 'none'\n      modifiedDate: 'modifyTimestamp'\n      objectClass: 'posixAccount'\n      objectFilter: '(objectClass=posixAccount)'\n      searchFilter: '${sas.identities.providers.ldap.user.accountId}={0}'\n    sas.identities.providers.ldap:\n      primaryGroupMembershipsEnabled: 'true'\n    sas.identities:\n      administrator: 'sasadm'\n    sas.logon.initial:\n      user: sasboot\n      password: Password123\n    sas.studio:\n      fileNavigationRoot: 'CUSTOM'\n      fileNavigationCustomRootPath: '/'\n      showServerFiles: 'true'\n      #defaultTextEncoding: 'ISO-8859-1'\n    # sas.files:\n    #   blockedTypes: 'application/hta, application/octet-stream, application/x-bat, application/x-javascript, application/x-msdownload, application/x-ms-shortcut, application/x-vbscript, application/x-wscript, application/x-wsh, text/javascript, text/vbscript, text/scriptlet, application/x-msdos-program'  \n  sas.compute.server:\n          #LaunchTimeout: 300\n          autoexec_code:\n              contents: |\n                  LOCKDOWN ENABLE_AMS=PYTHON;\n                  LOCKDOWN ENABLE_AMS=PYTHON_EMBED;\n                  LOCKDOWN ENABLE_AMS=SOCKET;\n          configuration_options:\n              contents: |\n                  -NOSOURCE\n                  -COMPRESS=YES\n                  -NOFMTERR\n          startup_commands:\n              contents: |\n                  umask 002\n          #export TZ=\"Europe/Paris\"\n  batch:\n      sas.batch.server:\n          autoexec_code:\n              contents: |\n                  LOCKDOWN ENABLE_AMS=PYTHON;\n                  LOCKDOWN ENABLE_AMS=PYTHON_EMBED;\n                  LOCKDOWN ENABLE_AMS=SOCKET;\n          configuration_options:\n              contents: |\n                  -RLANG\n          # startup_commands:\n          #     contents: |\n          #         export TZ=\"Europe/Paris\"\n     "
      site-config/storageclass.yaml: "kind: RWXStorageClass\r\nmetadata:\r\n  name: wildcard\r\nspec:\r\n  storageClassName: sas-nfs\r\n"
