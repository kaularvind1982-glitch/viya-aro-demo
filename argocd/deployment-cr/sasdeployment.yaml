  userContent:
    files:
      kustomization.yaml: "---\r\nnamespace: sasviya\r\nresources:\r\n  - sas-bases/base\r\n  - sas-bases/overlays/network/route.openshift.io/v1/route\r\n  - sas-bases/overlays/cas-server\r\n  # PostgreSQL\r\n  # Mandatory for both Internal/External PostgreSQL\r\n  - sas-bases/overlays/postgres/platform-postgres\r\n  # Internal PostgreSQL Provided by Crunchy Data\r\n  - sas-bases/overlays/crunchydata/postgres-operator\r\n  # CAS Auto Resources\r\n  - sas-bases/overlays/cas-server/auto-resources\r\n  # Intenal Opensearch\r\n  - sas-bases/overlays/internal-elasticsearch \r\n  # FS Group\r\n  - site-config/security/container-security/configmap-inputs.yaml\r\n  # OpenSSL certificate\r\n  #- sas-bases/examples/security/openssl-generated-ingress-certificate.yaml\r\n  # SingleStore\r\n  - sas-bases/overlays/sas-singlestore-osconfig/openshift\r\nconfigurations: \r\n  - sas-bases/overlays/required/kustomizeconfig.yaml\r\ntransformers:\r\n  - sas-bases/overlays/internal-elasticsearch/sysctl-transformer.yaml\r\n  - sas-bases/overlays/sas-programming-environment/refreshtoken\r\n  - sas-bases/overlays/required/transformers.yaml\r\n  - sas-bases/overlays/internal-elasticsearch/internal-elasticsearch-transformer.yaml\r\n  # OpenShift - Remove the Secure Computing (seccomp) profile\r\n  # As the default seccomp setting conflict withs the security that OpenShift already implements\r\n  # OpenShift then implicitly adds back the same default seccomp profile\r\n  - sas-bases/overlays/security/container-security/remove-seccomp-transformer.yaml\r\n  # OpenShift - Update fsGroup\r\n  - sas-bases/overlays/security/container-security/update-fsgroup.yaml\r\n  - sas-bases/overlays/cas-server/auto-resources/remove-resources.yaml\r\n  # NFS Compute\r\n  - site-config/sas-compute-server/configure/compute-server-add-nfs-mount.yaml\r\n  - site-config/sas-launcher/configure/launcher-nfs-mount.yaml\r\n  #CAS\r\n  - site-config/cas/configure/cas-add-nfs-mount.yaml\r\n  - site-config/cas/configure/cas-add-allowlist-paths.yaml\r\n  # Use HA Proxy certificates\r\n  - site-config/annotate-routes.yaml\r\n  #Disable WLO & remove launcher limits \r\n  - sas-bases/overlays/sas-workload-orchestrator/enable-disable/sas-workload-orchestrator-disable-patch-transformer.yaml\r\n  - sas-bases/overlays/sas-workload-orchestrator-server/enable-disable/sas-workload-orchestrator-server-disable-patch-transformer.yaml\r\n  - sas-bases/overlays/sas-launcher/launcher-disable-user-process-limits.yaml\r\n  # Internal PG replicas\r\n  - site-config/crunchy-replicas-transformer.yaml\r\n  # Rabbit MQ replicas\r\n  - site-config/rabbitmq-node-count.yaml\r\n  # SingleStore\r\n  - sas-bases/overlays/sas-singlestore-osconfig/openshift/daemonset-transformer.yaml\r\n  - site-config/sas-singlestore/sas-singlestore-cluster-config.yaml\r\ncomponents:\r\n  - sas-bases/components/sas-singlestore\r\n  - site-config/sas-singlestore\r\n  - sas-bases/components/crunchydata/internal-platform-postgres\r\n  - sas-bases/components/security/core/base/full-stack-tls\r\n  - sas-bases/components/security/network/route.openshift.io/route/full-stack-tls\r\n#generators:\r\n  #- site-config/security/customer-provided-ca-certificates.yaml\r\n  #- site-config/security/customer-provided-ingress-certificate.yaml      # Custom - Enable to include Customer provided certificate (Full TLS Mode)\r\n  #- site-config/security/customer-provided-merge-sas-certframe-configmap.yaml # Custom - Merges customer-provided configuration settings into the sas-certframe-user-config configmap (Full TLS Mode)\r\n# Custom SC\r\npatches:\r\n- path: site-config/storageclass.yaml\r\n  target:\r\n    kind: PersistentVolumeClaim\r\n    annotationSelector: sas.com/component-name in (sas-backup-job,sas-data-quality-services,sas-commonfiles,sas-cas-operator,sas-model-publish,sas-pyconfig)\r\nconfigMapGenerator:\r\n  - name: ingress-input\r\n    behavior: merge\r\n    literals:\r\n      - INGRESS_HOST=sasviya.apps.arkaul.eastus2.aroapp.io\r\n  - name: sas-shared-config\r\n    behavior: merge\r\n    literals:\r\n      - SAS_SERVICES_URL=https://sasviya.apps.arkaul.eastus2.aroapp.io\r\n  - name: sas-certframe-ingress-certificate-config\r\n    behavior: replace\r\n    literals:\r\n      - SAS_INGRESS_CERTIFICATE_SECRET_NAME=\"\"\r\n#Does not work for now\r\n# generatorOptions:\r\n#   disableNameSuffixHash: true\r\n# secretGenerator:\r\n#   - name: sas-consul-config                                              \r\n#     behavior: merge\r\n#     files:\r\n#       - SITEDEFAULT_CONF=site-config/sitedefault.yaml"
      sas-bases: ""
      site-config/annotate-routes.yaml: |-
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: annotate-routes
        patch: |-
          - op: remove
            path: /metadata/annotations/cert-utils-operator.redhat-cop.io~1certs-from-secret
        target:
          kind: Route
      site-config/cas/configure/cas-add-allowlist-paths.yaml: |
        # This block of code is for appending paths to the file system path
        # allowlist for the CAS server.  The {{ PATH-OR-VOLUME }} and
        # {{ PATH-OR-VOLUME-2 }} values can be either the name of a
        # Volume or a direct path.  These two values are provided
        # as an example for appending multiple paths to the
        # appendCASAllowlistPaths array.
        # If the value is the name of a Volume, e.g., "test-data-volume",
        # the CAS Operator will discover any Volume Mounts associated with
        # that Volume and append those path(s) to the CAS allowlist.
        # If the value is a path, e.g., "/data03/test-data", this
        # path will appended to the CAS allowlist directly.
        ---
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: cas-add-allowlist-paths
        patch: |-
          - op: add
            path: /spec/appendCASAllowlistPaths/-
            value:
              /export
        target:
          group: viya.sas.com
          kind: CASDeployment
          # Uncomment this to apply to all CAS servers:
          name: .*
          # Uncomment this to apply to one particular named CAS server:
          #name: {{ NAME-OF-SERVER }}
          # Uncomment this to apply to the default CAS server:
          #labelSelector: "sas.com/cas-server-default"
          version: v1alpha1
      site-config/cas/configure/cas-add-nfs-mount.yaml: |
        # This block of code is for mounting NFS persistentVolumeClaims and Data
        # Connectors for the CAS server.
        ---
        apiVersion: builtin
        kind: PatchTransformer
        metadata:
          name: cas-add-nfs-mount
        patch: |-
            - op: add
              path: /spec/controllerTemplate/spec/volumes/-
              value:
                name: sasviya-data
                nfs:
                  path: /export
                  server: 10.0.4.4
            - op: add
              path: /spec/controllerTemplate/spec/containers/0/volumeMounts/-
              value:
                name: sasviya-data
                mountPath: /export
        target:
          group: viya.sas.com
          kind: CASDeployment
          # Uncomment this to apply to all CAS servers:
          name: .*
          # Uncomment this to apply to one particular named CAS server:
          #name: {{ NAME-OF-SERVER }}
          # Uncomment this to apply to the default CAS server:
          #labelSelector: "sas.com/cas-server-default"
          version: v1alpha1
